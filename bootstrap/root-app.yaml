# Кореневий Application (App of Apps). Застосовується вручну один раз:
#   kubectl apply -f bootstrap/root-app.yaml
# Далі Argo CD сам бере з Git усі Application з каталогу argocd-apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/blossom-moon/tickets-gitops.git
    targetRevision: main
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
