apiVersion: v1
kind: Service
metadata:
  name: {{ include "tickets.app.fullname" . }}
  labels:
    {{- include "tickets.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "tickets.selectorLabels" (dict "ctx" $ "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      {{- if and (eq .Values.app.service.type "NodePort") .Values.app.service.nodePort }}
      nodePort: {{ .Values.app.service.nodePort }}
      {{- end }}
