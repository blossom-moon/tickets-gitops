apiVersion: v1
kind: Service
metadata:
  name: {{ include "tickets.db.fullname" . }}
  labels:
    {{- include "tickets.labels" (dict "ctx" $ "component" "db") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tickets.selectorLabels" (dict "ctx" $ "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.db.port }}
      targetPort: postgres
