{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tickets.secretName" . }}
  labels:
    {{- include "tickets.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
type: Opaque
data:
  db-password: {{ required "secrets.dbPassword обов'язковий" .Values.secrets.dbPassword | b64enc | quote }}
  keycloak-admin-password: {{ required "secrets.keycloakAdminPassword обов'язковий" .Values.secrets.keycloakAdminPassword | b64enc | quote }}
  keycloak-client-secret: {{ required "secrets.clientSecret обов'язковий" .Values.secrets.clientSecret | b64enc | quote }}
  app-user-password: {{ required "secrets.userPassword обов'язковий" .Values.secrets.userPassword | b64enc | quote }}
{{- end }}
