apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tickets.app.configName" . }}
  labels:
    {{- include "tickets.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
data:
  APP_ENVIRONMENT: {{ .Values.app.config.environment | quote }}
  APP_MESSAGE: {{ .Values.app.config.message | quote }}
  FAIL_RATE: {{ .Values.app.config.failRate | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://%s:%v/%s?options=-c%%20timezone=UTC" (include "tickets.db.fullname" .) .Values.db.port .Values.db.name | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.db.username | quote }}
  KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  KEYCLOAK_PUBLIC_URL: {{ include "tickets.keycloak.publicUrl" . | quote }}
  KEYCLOAK_INTERNAL_URL: {{ printf "http://%s:8080" (include "tickets.keycloak.fullname" .) | quote }}
